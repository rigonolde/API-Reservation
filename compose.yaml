services:
    database:
      image: mysql
      restart: always
      container_name: test_db
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: app
      networks:
        - test_network
      volumes:
        - db_data:/var/lib/mysql:rw
    php:
      container_name: test_php
      build: ./docker/
      ports:
        - "9000:9000"
      volumes:
        - .:/var/www/html
      networks:
        - test_network
      depends_on:
        - database
    nginx:
      image: nginx:alpine
      container_name: test_nginx
      ports:
        - "8080:80"
      volumes:
        - ./:/var/www/html
        - ./docker/ngix_default.conf:/etc/nginx/conf.d/default.conf
        - ./docker/logs:/var/log/nginx/
      networks:
        - test_network
networks:
  test_network:
volumes:
  db_data:
